<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand">NEXORA</div>
      <a class="nav-item" href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a class="nav-item" href="employees.html"><span class="dot"></span>Employees</a>
      <a class="nav-item active" href="products.html"><span class="dot"></span>Products</a>
      <a class="nav-item" href="inventory.html"><span class="dot"></span>Inventory</a>
      <a class="nav-item" href="sales.html"><span class="dot"></span>Sales</a>
      <a class="nav-item" href="invoice.html"><span class="dot"></span>Invoice</a>
      <a class="nav-item" href="finance.html"><span class="dot"></span>Finance</a>
      <a class="nav-item" href="reports.html"><span class="dot"></span>Reports</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>Products</h1>
      <button class="theme-btn" onclick="toggleTheme()">&#9789; / &#9728; Theme</button>
    </div>
    <div class="content">

      <div class="toolbar">
        <input placeholder="Search products...">
        <select><option>All Categories</option><option>Electronics</option><option>Apparel</option></select>
        <button class="btn-mini" onclick="showToast('Add Product form goes here')">+ Add Product</button>
      </div>
      <div class="panel table-wrap">
        <table>
          <tr><th>Product</th><th>Category</th><th>Price</th><th>Qty</th><th>Stock</th></tr>
          <tr><td>Retro Keyboard</td><td>Electronics</td><td>$45</td><td>32</td><td><span class="status active">In Stock</span></td></tr>
          <tr><td>Y2K Sunglasses</td><td>Apparel</td><td>$18</td><td>6</td><td><span class="status pending">Low</span></td></tr>
          <tr><td>Bubble Backpack</td><td>Apparel</td><td>$32</td><td>0</td><td><span class="status inactive">Out</span></td></tr>
        </table>
        <div class="pagination"><span class="active">1</span><span>2</span></div>
      </div>

    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
