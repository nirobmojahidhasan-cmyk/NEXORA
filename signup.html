<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign Up · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <p class="brand">Create Account</p>
    <p class="brand-sub">Join NEXORA ERP</p>
    <form id="signup-form">
      <div class="field"><label for="name">Full name</label><input id="name" type="text" placeholder="Jane Doe" required></div>
      <div class="field"><label for="s-email">Email</label><input id="s-email" type="email" placeholder="you@company.com" required></div>
      <div class="field pw-row">
        <label for="s-pw">Password</label>
        <input id="s-pw" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        <button type="button" class="pw-toggle" onclick="togglePassword('s-pw', this)">SHOW</button>
        <div class="strength"><span></span></div>
        <p class="hint">Use 8+ characters with a number and symbol.</p>
      </div>
      <button type="submit" class="btn-primary" onclick="event.preventDefault(); window.location='index.html';">CREATE ACCOUNT</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="index.html">Log in</a></p>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
