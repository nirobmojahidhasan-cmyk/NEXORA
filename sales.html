<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand">NEXORA</div>
      <a class="nav-item" href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a class="nav-item" href="employees.html"><span class="dot"></span>Employees</a>
      <a class="nav-item" href="products.html"><span class="dot"></span>Products</a>
      <a class="nav-item" href="inventory.html"><span class="dot"></span>Inventory</a>
      <a class="nav-item active" href="sales.html"><span class="dot"></span>Sales</a>
      <a class="nav-item" href="invoice.html"><span class="dot"></span>Invoice</a>
      <a class="nav-item" href="finance.html"><span class="dot"></span>Finance</a>
      <a class="nav-item" href="reports.html"><span class="dot"></span>Reports</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>Sales</h1>
      <button class="theme-btn" onclick="toggleTheme()">&#9789; / &#9728; Theme</button>
    </div>
    <div class="content">

      <div class="panels">
        <div class="panel">
          <h3>New Sale &mdash; Cart</h3>
          <table>
            <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
            <tr><td>Retro Keyboard</td><td>1</td><td>$45.00</td></tr>
            <tr><td>Y2K Sunglasses</td><td>2</td><td>$36.00</td></tr>
          </table>
          <p class="scanline-note">Subtotal $81.00 &middot; Tax $4.05 &middot; Total $85.05 (static preview)</p>
        </div>
        <div class="panel">
          <h3>Checkout</h3>
          <div class="field"><label>Discount code</label><input placeholder="Y2KVIBES"></div>
          <button class="btn-primary" onclick="showToast('Sale recorded (demo)')">Complete Sale</button>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
