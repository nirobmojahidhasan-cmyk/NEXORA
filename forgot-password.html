<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot Password · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <p class="brand">Forgot Password</p>
    <p class="brand-sub">We'll send a reset link to your email</p>
    <form id="forgot-form">
      <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" placeholder="you@company.com" required></div>
      <button type="submit" class="btn-primary" onclick="event.preventDefault(); window.location='reset-password.html';">SEND RESET LINK</button>
    </form>
    <p class="auth-foot"><a href="index.html">Back to log in</a></p>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
