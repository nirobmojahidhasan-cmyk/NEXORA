<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand">NEXORA</div>
      <a class="nav-item" href="dashboard.html"><span class="dot"></span>Dashboard</a>
      <a class="nav-item" href="employees.html"><span class="dot"></span>Employees</a>
      <a class="nav-item" href="products.html"><span class="dot"></span>Products</a>
      <a class="nav-item active" href="inventory.html"><span class="dot"></span>Inventory</a>
      <a class="nav-item" href="sales.html"><span class="dot"></span>Sales</a>
      <a class="nav-item" href="invoice.html"><span class="dot"></span>Invoice</a>
      <a class="nav-item" href="finance.html"><span class="dot"></span>Finance</a>
      <a class="nav-item" href="reports.html"><span class="dot"></span>Reports</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>Inventory</h1>
      <button class="theme-btn" onclick="toggleTheme()">&#9789; / &#9728; Theme</button>
    </div>
    <div class="content">

      <div class="stat-grid">
        <div class="stat-card"><div class="lbl">Current Stock</div><div class="val">4,120 units</div></div>
        <div class="stat-card"><div class="lbl">Low Stock Items</div><div class="val">6</div></div>
        <div class="stat-card"><div class="lbl">Out of Stock</div><div class="val">2</div></div>
      </div>
      <div class="panel table-wrap">
        <h3>Inventory History</h3>
        <table>
          <tr><th>Date</th><th>Product</th><th>Change</th><th>Type</th></tr>
          <tr><td>18 Sep</td><td>Retro Keyboard</td><td>+50</td><td><span class="status active">Stock In</span></td></tr>
          <tr><td>17 Sep</td><td>Y2K Sunglasses</td><td>-14</td><td><span class="status pending">Stock Out</span></td></tr>
          <tr><td>15 Sep</td><td>Bubble Backpack</td><td>-8</td><td><span class="status inactive">Stock Out</span></td></tr>
        </table>
      </div>

    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
