<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password · NEXORA ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <p class="brand">Reset Password</p>
    <p class="brand-sub">Choose a new password</p>
    <form id="reset-form">
      <div class="field pw-row">
        <label for="r-pw">New password</label>
        <input id="r-pw" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
        <button type="button" class="pw-toggle" onclick="togglePassword('r-pw', this)">SHOW</button>
      </div>
      <div class="field"><label for="r-pw2">Confirm password</label><input id="r-pw2" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required></div>
      <button type="submit" class="btn-primary" onclick="event.preventDefault(); window.location='index.html';">RESET PASSWORD</button>
    </form>
    <p class="auth-foot"><a href="index.html">Back to log in</a></p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
